name: CO-CHI TV 0.26.20 - Publicación aprobada
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cochi-publicar-02620-aprobada.yml
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validar que la release no exista antes de subirla
        run: |
          set -euo pipefail
          if gh release view v0.26.20 -R MARIELAGALV/CO-CHIUPDATES >/dev/null 2>&1; then
            echo 'La version ya existe y no se reemplazara.'
            exit 1
          fi
      - name: Obtener APK exactamente aprobada y verificar SHA256
        run: |
          set -euo pipefail
          mkdir -p /tmp/cochi
          curl -fLsS --retry 3 --retry-delay 2 --max-time 160 -o /tmp/cochi/approved.zip 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-2e7c-820e-9bf4-c8a1035725c5/raw?se=2026-11-02T12%3A25%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=1f8f7f81-2c04-50cc-a267-62fba8b5802b&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T12%3A17%3A40Z&ske=2026-11-03T12%3A17%3A40Z&sks=b&skv=2026-02-06&sig=N0LZumIJQL9NkzjOu7Oh8kjDy3ZDFOy5fJG3jsT63Lc%3D'
          echo '35e0d734c61302a3afb856c7f9c0c78881e8b99a771bf3e2a13a4eec6ebdcc15  /tmp/cochi/approved.zip' | sha256sum -c -
          test "$(unzip -Z1 /tmp/cochi/approved.zip)" = 'COCHI_TV_SEGUIR_VIENDO_NOMBRE_PRUEBA.apk'
          unzip -p /tmp/cochi/approved.zip COCHI_TV_SEGUIR_VIENDO_NOMBRE_PRUEBA.apk > /tmp/cochi/CO-CHI.apk
          echo '7c771dd3f37590f843eb8dcdc8e964f3e01c08c3ff0c2babf3857fe660f4dbd1  /tmp/cochi/CO-CHI.apk' | sha256sum -c -
      - name: Validar APK, versionCode y certificado de actualizacion sobre existente
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BT/apksigner" verify --verbose --print-certs /tmp/cochi/CO-CHI.apk | tee /tmp/cochi/cert.txt
          grep -qi '944f7bcfd9f1e6fe3e899de719c9c38f04925adadd891420d388705382ebd442' /tmp/cochi/cert.txt
          "$BT/aapt" dump badging /tmp/cochi/CO-CHI.apk > /tmp/cochi/badging.txt
          head -n 3 /tmp/cochi/badging.txt
          grep -q "versionCode='2625'" /tmp/cochi/badging.txt
          grep -q "versionName='0.26.20-" /tmp/cochi/badging.txt
          "$BT/zipalign" -c -p 4 /tmp/cochi/CO-CHI.apk
          echo 'SHA256, firma CO-CHI y versionCode 2625: OK.'
      - name: Publicar release que consultan los televisores
        run: |
          set -euo pipefail
          gh release create v0.26.20 /tmp/cochi/CO-CHI.apk \
            -R MARIELAGALV/CO-CHIUPDATES \
            --target main \
            --title 'CO-CHI TV 0.26.20 - Seguir viendo corregido' \
            --notes 'Actualizacion aprobada el 2 de noviembre de 2026. Seguir viendo: una sola tarjeta por nombre de serie; conservar progreso de capitulo, incluso al mover categorias. Firma original, instalacion encima, versionCode 2625.' \
            --latest
          gh release view v0.26.20 -R MARIELAGALV/CO-CHIUPDATES \
            --json url,tagName,isDraft,isPrerelease,publishedAt,assets \
            --jq '{url,version:.tagName,draft:.isDraft,pre:.isPrerelease,publicado:.publishedAt,archivos:[.assets[].name]}'
